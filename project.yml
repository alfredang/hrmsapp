name: TertiaryHRMSiOSApp

options:
  bundleIdPrefix: com.tertiaryinfotech
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "1.7"
    CURRENT_PROJECT_VERSION: "13"
    SWIFT_VERSION: "5.0"
    # Google Sign-In (native, ASWebAuthenticationSession + PKCE).
    # Paste the "iOS" OAuth client id from Google Cloud Console here; the URL scheme
    # is that same id with its dot-separated parts reversed. Leave BOTH empty to ship
    # a build with the Google button hidden. Public values, not secrets — a native
    # OAuth client has no secret and the backend verifies every token with Google.
    GOOGLE_IOS_CLIENT_ID: "530515169905-6gi9km2pf28varo4is8obmmhr4t23pg4.apps.googleusercontent.com"
    GOOGLE_IOS_URL_SCHEME: "com.googleusercontent.apps.530515169905-6gi9km2pf28varo4is8obmmhr4t23pg4"
    DEVELOPMENT_TEAM: "GU9WTSTX9M"   # Tertiary Infotech Academy (paid) — same team as the other apps
    CODE_SIGN_STYLE: Automatic

targets:
  TertiaryHRMSiOSApp:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: TertiaryHRMSiOSApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tertiaryinfotech.hrportal   # matches existing App Store record "Tertiary HRMS"
        INFOPLIST_FILE: TertiaryHRMSiOSApp/Support/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"   # iPhone only
        SUPPORTS_MACCATALYST: NO
